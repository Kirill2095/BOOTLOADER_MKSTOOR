# ============================================================================
# MKSTOOR cross file: x86_64 UEFI application images
# Usage: meson setup build --cross-file meson/cross-x86_64-uefi.ini
#
# Requires a compiler that can emit PE/COFF EFI apps. Two supported paths:
#   1. clang >= 15  (target x86_64-pc-windows-msvc-ish via -target + lld)
#   2. gcc built with --target=x86_64-w64-mingw32 (mingw-w64 toolchain,
#      package "gcc-mingw-w64" on Debian/Ubuntu, "mingw64-gcc" on Fedora)
# The [built-in options] below pin the mingw-flavour gcc which produces
# PIE PE executables accepted directly by UEFI firmware.
# ============================================================================

[binaries]
c       = 'x86_64-w64-mingw32-gcc'
cpp     = 'x86_64-w64-mingw32-g++'
ar      = 'x86_64-w64-mingw32-ar'
strip   = 'x86_64-w64-mingw32-strip'
objcopy = 'x86_64-w64-mingw32-objcopy'
# rust = 'rustc'  # enabled when -Denable_rust=true; see README re: uefi targets

[host_machine]
system     = 'uefi'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
c_args = ['-I/usr/include/efi', '-I/usr/include/efi/x86_64',
          '-fshort-wchar', '-mgeneral-regs-only']
c_link_args = []

[properties]
# Documented hint for future pkg-config wrapper work (not consumed today):
needs_exe_wrapper = false
